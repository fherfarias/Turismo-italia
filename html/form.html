<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco</title>

    <link rel="icon" href="https://img.icons8.com/?size=100&id=48352&format=png&color=12B886">
</head>
<body bgcolor="#90EE90">
    <h1 style="color: rgb(190, 17, 17); text-shadow: 1px 3px rgb(100, 18, 18);">FALE CONOSCO</h1>
    <Form>
        <b>Nome:</b> <input type="text" placeholder="Digite seu nome"><br><br>
        <b>E-mail:</b> <input type="email" placeholder="Digite seu E-mail" required><br><br>
        <b>Telefone:</b> <input type="tel" placeholder="Número"><br><br>
        <b>Locais disponiveis para reserva:</b>
        <select name="" id="">
            <option value="">Trivago - Roma</option>
            <option value="">Airbnb</option>
            <option value="">Camping Village Fabulous</option>
            <option value="">Hotel Artis</option>
            <option value="">Radisson Blu GHR Hotel, Rome</option> 
        </select><br><br>
        <b>Estádia:</b><input type="number" min="1" max="31"><br><br>
        <b>Hora:</b> <input type="time"><br><br>
        <b>Quantidade de Adultos:</b> <input type="text" placeholder="Digite"><br><br>
        <b>Quantidade de Crianças: </b><input type="text" placeholder="Digite"><br><br>
             <b> Forma de Pagamento:</b> <input type="radio" name="Pagamento"> Pix
              <input type="radio" name="Pagamento">Crédito
              <input type ="radio" name="Pagamento">Débito<br><br>
        <b>Observação de Reserva:</b> <br><br>
        <textarea name="" id="Dúvida" rows="10" cols="30"></textarea><br><br>
        <input type="radio"> Aceita termos de Reserva?
        <br><br>
        <input type="reset" value="Limpar">
        <input type="submit" value="Reservar" onclick="alert('Reserva feita com sucesso!')">
        <button> Botão </button>
    </Form>
    
</body>
</html>
